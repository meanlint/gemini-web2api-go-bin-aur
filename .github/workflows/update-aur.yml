name: Update gemini-web2api-go-bin and push to AUR

on:
  schedule:
    - cron: '37 */6 * * *'   # 每 6 小时轮询一次上游最新 Release
  workflow_dispatch: {}       # 支持在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  update-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest gemini-web2api-go release
        id: rel
        run: |
          data=$(curl -sL https://api.github.com/repos/zexadev/gemini-web2api-go/releases/latest)
          ver=$(echo "$data" | jq -r '.tag_name' | sed 's/^v//')
          amd64_sha=$(echo "$data" | jq -r --arg v "$ver" '.assets[] | select(.name=="gemini-web2api-go_v" + $v + "_linux_amd64") | .digest' | sed 's/^sha256://')
          arm64_sha=$(echo "$data" | jq -r --arg v "$ver" '.assets[] | select(.name=="gemini-web2api-go_v" + $v + "_linux_arm64") | .digest' | sed 's/^sha256://')
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "amd64_sha=$amd64_sha" >> "$GITHUB_OUTPUT"
          echo "arm64_sha=$arm64_sha" >> "$GITHUB_OUTPUT"

      - name: Check whether the package already exists on AUR
        id: aur
        run: |
          count=$(curl -s "https://aur.archlinux.org/rpc/v5/info/gemini-web2api-go-bin" | jq -r '.resultcount')
          echo "exists=$([ "$count" != "0" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Decide whether a push is needed
        id: check
        run: |
          current=$(grep -Po '(?<=^pkgver=).*' PKGBUILD)
          # 有更新版本，或者包在 AUR 上还不存在（首次提交），都需要推送
          if [ "$current" != "${{ steps.rel.outputs.version }}" ] || [ "${{ steps.aur.outputs.exists }}" = "false" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump PKGBUILD
        if: steps.check.outputs.changed == 'true'
        run: |
          sed -i "s/^pkgver=.*/pkgver=${{ steps.rel.outputs.version }}/" PKGBUILD
          sed -i "s/^pkgrel=.*/pkgrel=1/" PKGBUILD
          sed -i "s/^sha256sums_x86_64=.*/sha256sums_x86_64=('${{ steps.rel.outputs.amd64_sha }}')/" PKGBUILD
          sed -i "s/^sha256sums_aarch64=.*/sha256sums_aarch64=('${{ steps.rel.outputs.arm64_sha }}')/" PKGBUILD

      - name: Regenerate .SRCINFO (needs makepkg, run in Arch container)
        if: steps.check.outputs.changed == 'true'
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD":/repo -w /repo \
            archlinux:base-devel \
            bash -c "export HOME=/tmp; makepkg --printsrcinfo > .SRCINFO"

      - name: Commit changes to GitHub
        if: steps.check.outputs.changed == 'true'
        run: |
          git config user.name "gemini-web2api-go-bin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo "no PKGBUILD/.SRCINFO changes to commit (first AUR submission of an already-current version)"
          else
            git commit -m "chore: bump gemini-web2api-go-bin to ${{ steps.rel.outputs.version }}"
            git push origin HEAD:main
          fi

      - name: Push to AUR
        if: steps.check.outputs.changed == 'true'
        env:
          SSH_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -t ed25519 aur.archlinux.org >> ~/.ssh/known_hosts 2>/dev/null

          git clone ssh://aur@aur.archlinux.org/gemini-web2api-go-bin.git aur-repo
          cp PKGBUILD .SRCINFO gemini-web2api-go.service gemini-web2api-go.env gemini-web2api-go-bin.install aur-repo/
          cd aur-repo
          # 空仓库（首次提交）clone 下来的本地分支名取决于 runner 的
          # init.defaultBranch，不一定是 master，这里强制固定分支名。
          git checkout -B master
          git config user.name "gemini-web2api-go-bin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to push"
            exit 0
          fi
          git commit -m "gemini-web2api-go-bin ${{ steps.rel.outputs.version }}"
          git push origin master
